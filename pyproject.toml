[project]
name = "adeptly"
version = "0.1.0"
description = "Python 3.12+ library for adaptive DQN agents in real-time games"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Bischoff, Silas", email = "silas.bischoff@googlemail.com" },
]
requires-python = ">=3.12"
keywords = ["ai", "agent", "dqn", "real-time", "games"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2,<3",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/sbischoff-ai/adeptly"

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pydoc-markdown>=4.8.2",
    "pydocstyle>=6.3.0",
    "pylint>=2.17,<3",
    "pylint-fail-under>=0.3.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
]

[tool.black]
line-length = 119
target-version = ["py312"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
